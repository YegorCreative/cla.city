<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bible Blog — Church LA" />
  <base href="../" />
  <title>Bible Blog — Church LA</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>

  <div data-partial="header"></div>

  <main>
    <section class="page-hero page-hero--res" aria-labelledby="blog-heading">
      <div class="container">
        <h1 id="blog-heading">Bible Blog</h1>
      </div>
    </section>

    <section class="section" aria-labelledby="blog-introduction-heading">
      <div class="container container--narrow">
        <div class="section-header">
          <h2 id="blog-introduction-heading">Introduction</h2>
          <!-- Approved introduction -->
        </div>
      </div>
    </section>

    <section class="section bg-alt" aria-labelledby="featured-posts-heading">
      <div class="container">
        <div class="section-header">
          <h2 id="featured-posts-heading">Featured Posts</h2>
        </div>
        <div class="cards-grid--2">
          <!-- Approved featured post -->
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="recent-posts-heading">
      <div class="container">
        <div class="section-header">
          <h2 id="recent-posts-heading">Recent Posts</h2>
        </div>
        <div class="cards-grid">
          <!-- Approved post cards -->
        </div>
      </div>
    </section>
  </main>

  <div data-partial="footer"></div>

  <script type="module" src="../assets/js/script.js"></script>
</body>
</html>
