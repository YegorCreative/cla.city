<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Church LA</title>
  <meta name="description" content="This page doesn't exist, but you're still welcome here." />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .error-page {
      min-height: 100vh;
      background: var(--c-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--sp-md);
    }
    .error-code {
      font-family: var(--f-heading);
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 700;
      color: var(--c-primary);
      line-height: 1;
      margin-bottom: var(--sp-sm);
      opacity: 0.85;
    }
    .error-page h1 { color: var(--c-white); font-size: clamp(1.6rem, 3vw, 2.4rem); margin-bottom: var(--sp-sm); }
    .error-page p  { color: rgba(255,255,255,0.6); max-width: 420px; margin-inline: auto; margin-bottom: var(--sp-md); }
    .error-btns    { display: flex; gap: var(--sp-sm); justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <div class="error-code">404</div>
      <h1>Page Not Found</h1>
      <p>This page doesn't exist — but you are still very welcome here. Let's get you somewhere good.</p>
      <div class="error-btns">
        <a href="en/index.html" class="btn btn-primary">Go to Home (EN)</a>
        <a href="ru/index.html" class="btn btn-outline">На главную (RU)</a>
      </div>
    </div>
  </main>
</body>
</html>
