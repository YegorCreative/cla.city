<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workflows · CLA</title><link rel="stylesheet" href="../../assets/css/styles.css"></head><body class="admin-inbox"><main class="admin-shell"><header class="admin-header"><div><span class="eyebrow">CLA City</span><h1>Workflow Executions</h1></div><a class="btn btn-dark" href="../">Dashboard</a></header><div id="executions"></div></main><script type="module">const e=document.getElementById('executions');const x=await(await fetch('/api/admin/workflows')).json();e.innerHTML=x.map(i=>`<article class="admin-detail task-card"><strong>${i.status}</strong><h2>${i.trigger}</h2><p>${i.entityType} · ${i.entityId}</p><p>${new Date(i.startedAt).toLocaleString()}${i.error?` · ${i.error}`:''}</p></article>`).join('')||'<p>No workflow executions yet.</p>';</script></main></body></html>
