<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLA Inbox</title><link rel="stylesheet" href="../../assets/css/styles.css"></head>
<body class="admin-inbox"><main class="admin-shell"><header class="admin-header"><div><span class="eyebrow">CLA City</span><h1>Contact Inbox</h1></div><a class="btn btn-dark" href="../../en/index.html">View site</a></header>
<section class="admin-toolbar" aria-label="Inbox filters"><input id="search" type="search" placeholder="Search name, email, message" aria-label="Search"><select id="status"><option value="">All statuses</option><option>New</option><option>In Progress</option><option>Waiting</option><option>Closed</option></select><select id="category"><option value="">All categories</option><option value="general">General</option><option value="prayer">Prayer</option><option value="visit">Visit</option><option value="connection">Connection</option></select><select id="language"><option value="">All languages</option><option value="en">English</option><option value="ru">Russian</option></select></section>
<div class="admin-layout"><section><div id="empty" class="admin-empty" hidden>No contact submissions yet.</div><div id="contacts" class="admin-list" aria-live="polite"></div><nav class="admin-pagination" aria-label="Pagination"><button id="prev">Previous</button><span id="page">Page 1</span><button id="next">Next</button></nav></section><aside id="detail" class="admin-detail" aria-label="Contact details"><p>Select a contact to view details.</p></aside></div></main><script type="module" src="./inbox.js"></script></body></html>
