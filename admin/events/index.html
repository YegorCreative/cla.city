<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events Admin · CLA</title><link rel="stylesheet" href="../../assets/css/styles.css"></head><body class="admin-inbox"><main class="admin-shell"><header class="admin-header"><div><span class="eyebrow">CLA City</span><h1>Events</h1></div><a class="btn btn-dark" href="../">Dashboard</a></header><div id="events"></div><button id="new" class="btn btn-primary">Create Event</button></main><script type="module">const root=document.getElementById('events');async function load(){const x=await(await fetch('/api/admin/events')).json();root.innerHTML=x.map(i=>`<article class="admin-detail task-card"><h2>${i.title}</h2><p>${new Date(i.startDate).toLocaleString()} · ${i.location}</p><p>${i.isPublished?'Published':'Draft'} · ${i._count.registrations} registrations</p><button data-id="${i.id}" class="btn btn-dark">${i.isPublished?'Unpublish':'Publish'}</button></article>`).join('')}root.onclick=async e=>{if(e.target.dataset.id){await fetch('/api/admin/events',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:e.target.dataset.id,isPublished:e.target.textContent==='Publish'})});load()}};load();</script></body></html>
