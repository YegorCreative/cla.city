<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events · CLA City</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="container section"><span class="eyebrow">CLA City</span><h1>Events</h1><div id="events" class="cards-grid"></div></main><script type="module">const e=document.getElementById('events');const x=await (await fetch('/api/events')).json();e.innerHTML=x.map(i=>`<article class="card"><h2>${i.title}</h2><p>${i.description}</p><p>${new Date(i.startDate).toLocaleString()} · ${i.location}</p>${i.registrationEnabled?`<a class="btn btn-primary" href="./${i.slug}.html">Register</a>`:''}</article>`).join('')||'<p>No upcoming events.</p>';</script></body></html>
