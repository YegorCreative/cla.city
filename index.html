<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Church LA — cla.city</title>
  <meta name="description" content="Church LA — A bilingual English/Russian church in Los Angeles. You are welcome here." />
  <meta name="robots" content="noindex" />
  <style>
    html,body{margin:0;padding:0;background:#1A1C20;min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      font-family:system-ui,sans-serif;color:#fff;}
    .choices{text-align:center;}
    .choices h1{font-size:1.6rem;margin-bottom:1.5rem;opacity:.9;}
    .lang-row{display:flex;gap:1rem;justify-content:center;}
    .lang-link{
      padding:.9rem 2.4rem;
      border-radius:6px;
      background:rgba(255,255,255,.08);
      color:#fff;
      text-decoration:none;
      font-weight:600;
      font-size:1.1rem;
      border:1.5px solid rgba(255,255,255,.2);
      transition:.2s;
    }
    .lang-link:hover{background:#C28A5D;border-color:#C28A5D;}
  </style>
  <script>
    (function(){
      var lang = navigator.language || navigator.userLanguage || '';
      if (lang.toLowerCase().startsWith('ru')) {
        window.location.replace('./ru/');
      } else {
        window.location.replace('./en/');
      }
    })();
  </script>
</head>
<body>
  <!-- Fallback for users with JS disabled -->
  <noscript>
    <div class="choices">
      <h1>Church LA — cla.city</h1>
      <div class="lang-row">
        <a href="./en/" class="lang-link">English</a>
        <a href="./ru/" class="lang-link">Русский</a>
      </div>
    </div>
  </noscript>
  <div class="choices" id="fallback" style="display:none">
    <h1>Church LA</h1>
    <div class="lang-row">
      <a href="./en/" class="lang-link">English</a>
      <a href="./ru/" class="lang-link">Русский</a>
    </div>
  </div>
  <script>
    // Show fallback if redirect somehow stalls
    setTimeout(function(){ document.getElementById('fallback').style.display='block'; }, 1500);
  </script>
</body>
</html>
